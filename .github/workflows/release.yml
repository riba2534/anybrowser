name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app version
        run: |
          version=$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - Resources/Info.plist)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Info.plist ($version)" >&2
            exit 1
          fi
      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          swift --version
      - name: Package
        run: ./scripts/build-app.sh
      # The archive below is made from this very app, so what ships has run the real-browser suites.
      - name: Test the packaged app
        # One suite at a time: the hosted runner has three cores, and dozens of browsers starting
        # at once there miss their 20-second readiness deadline.
        run: ./scripts/test.sh --engine dist/AnyBrowser.app --no-parallel
      - name: Archive
        run: |
          /usr/bin/codesign --verify --deep --strict dist/AnyBrowser.app
          name="AnyBrowser-${GITHUB_REF_NAME#v}-macos-arm64.zip"
          mkdir -p out
          /usr/bin/ditto -c -k --keepParent dist/AnyBrowser.app "out/$name"
          (cd out && shasum -a 256 "$name" > SHA256SUMS)
          cat out/SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --verify-tag \
            --title "AnyBrowser $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
